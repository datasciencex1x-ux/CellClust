[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellclust"
version = "1.0.0"
description = "Unsupervised multi-algorithm classification of skeletal muscle fibers by minimum Feret diameter"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Paola Llanos"},
    {name = "Javier Russell-Guzmán"},
    {name = "Matías Monsalves-Álvarez"},
    {name = "Matías Aravena"},
    {name = "Martín Maturana"},
    {name = "Rodrigo Olivares"},
    {name = "Pablo Olivares"},
    {name = "José Francisco López-Gil"},
    {name = "Rodrigo Yáñez-Sepúlveda"},
]
keywords = [
    "skeletal muscle",
    "morphometry",
    "unsupervised clustering",
    "feret diameter",
    "myofiber classification",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "minisom>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "ruff>=0.1",
]

[project.urls]
Repository = "https://gitlab.com/rigo1983/cellclust"
Issues = "https://gitlab.com/rigo1983/cellclust/-/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cellclust = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
